name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (typecheck + build)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      # Solo los paquetes internos: el paquete raíz necesita las librerías
      # nativas del webview, que se compilan en el workflow de release.
      - name: Go (vet + test)
        run: |
          go vet ./internal/...
          go test ./internal/...

      - name: Playwright (smoke de la UI)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
